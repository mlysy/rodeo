[project]
name = "rodeo"
version = "1.1.3"
description = "Probabilistic Methods of Parameter Inference for ODEs"
readme = "README.md"
authors = [
    {email = "mhwu@uwaterloo.ca", name = "Mohan Wu"},
    {email = "mlysy@uwaterloo.ca", name = "Martin Lysy"}
]
maintainers = [
    {email = "mlysy@uwaterloo.ca", name = "Martin Lysy"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]
keywords = [
    "jax", 
    "parameter-inference", 
    "differential-equations", 
    "rodeo", 
    "probabilistic-solver"
]
license = "MIT"
license-files = ["LICENSE.*"]
requires-python = ">=3.10"
dependencies = [
    "blackjax<=1.2.3 ; python_full_version < '3.10'",
    "blackjax>1.2.3 ; python_full_version >= '3.10'",
    "jax>=0.6.2",
    "jaxlib>=0.6.2",
]

[project.urls]
Repository = "https://github.com/mlysy/rodeo"
Issues = "https://github.com/mlysy/rodeo/issues"
Changelog = "https://github.com/mlysy/rodeo/CHANGELOG.md"
Documentation = "https://rodeo.readthedocs.io/"


[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  {include-group = "docs"},
  {include-group = "test"},
]
docs = [
    "jaxopt>=0.8.3",
    "jupytext>=1.19.1",
    "matplotlib>=3.10.8",
    "myst-nb>=1.4.0",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-env>=1.6.0",
]

[tool.pytest.ini_options]
env = [
    "JAX_ENABLE_X64=True",
]
addopts = "--ignore=tests/local"
testpaths = ["tests"]
